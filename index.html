<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ant Colony Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --c1:#e85d04;--c1l:#ff9a3c;--c1d:#7c2d00;
  --c2:#3a86ff;--c2l:#90c2ff;--c2d:#003a8c;
  --bg:#1a1208;--soil:#2d1f0e;--soilL:#3d2a12;
  --food:#4caf50;--panel:#0e0a04;
}
body{background:var(--bg);font-family:'Share Tech Mono',monospace;color:#c8b88a;overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/* TOP BAR */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);border-bottom:1px solid #3d2a12;
  padding:6px 14px;flex-shrink:0;gap:10px;flex-wrap:wrap;
}
#title-txt{font-family:'Orbitron',monospace;font-size:.85em;color:#c8b88a;letter-spacing:3px;}

.colony-stat{display:flex;align-items:center;gap:8px;}
.cs-label{font-size:.7em;color:#7a6a4a;letter-spacing:1px;}
.cs-val{font-size:1em;font-weight:700;}
.cs-bar{width:80px;height:6px;background:#1a1208;border-radius:3px;overflow:hidden;}
.cs-fill{height:100%;border-radius:3px;transition:width .3s;}
.c1{color:var(--c1);}
.c2{color:var(--c2);}
.fill1{background:var(--c1);}
.fill2{background:var(--c2);}

.divider{width:1px;height:30px;background:#3d2a12;}

/* CONTROLS */
#controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{
  font-family:'Share Tech Mono',monospace;font-size:.72em;
  background:transparent;border:1px solid #3d2a12;color:#c8b88a;
  padding:4px 10px;border-radius:3px;cursor:pointer;letter-spacing:1px;
  transition:all .15s;
}
.btn:hover{background:#3d2a12;color:#f0d080;}
.btn.active{background:#3d2a12;border-color:#c8b88a;color:#f0d080;}
#speedBtn{border-color:var(--c1);color:var(--c1);}
#speedBtn.fast{background:var(--c1);color:#000;}
#warBtn{border-color:#ff4444;color:#ff4444;}
#warBtn.active{background:#ff4444;color:#000;}

/* CANVAS */
#canvasWrap{position:relative;flex:1;overflow:hidden;}
canvas{display:block;}
#mainCanvas{position:absolute;top:0;left:0;}
#pheCanvas{position:absolute;top:0;left:0;opacity:0.7;}
#antCanvas{position:absolute;top:0;left:0;}

/* SIDE PANEL */
#sidebar{
  position:absolute;right:0;top:0;bottom:0;
  width:160px;background:rgba(14,10,4,.92);
  border-left:1px solid #3d2a12;
  padding:10px 8px;font-size:.68em;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.slog{font-size:.65em;color:#7a6a4a;border-bottom:1px solid #2d1f0e;padding-bottom:4px;margin-bottom:2px;letter-spacing:1px;}
.event{color:#c8b88a;line-height:1.5;opacity:1;transition:opacity 1s;}
.event.old{opacity:.35;}
.event.war{color:#ff6644;}
.event.food{color:#88cc44;}
.event.birth{color:#aaddff;}

/* LEGEND */
#legend{
  position:absolute;left:8px;bottom:8px;
  background:rgba(14,10,4,.88);border:1px solid #3d2a12;
  padding:8px 10px;font-size:.63em;
  border-radius:3px;line-height:1.9;pointer-events:none;
}
.leg-row{display:flex;align-items:center;gap:6px;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* TOOLTIP */
#tooltip{
  position:absolute;display:none;
  background:rgba(14,10,4,.95);border:1px solid #3d2a12;
  padding:6px 10px;font-size:.65em;border-radius:3px;
  pointer-events:none;line-height:1.7;white-space:nowrap;
}
</style>
</head>
<body>

<div id="topbar">
  <span id="title-txt">🐜 ANT COLONY SIM</span>

  <div class="colony-stat">
    <span class="cs-label">COL.1</span>
    <span class="cs-val c1" id="cnt1">0</span>
    <div class="cs-bar"><div class="cs-fill fill1" id="bar1" style="width:50%"></div></div>
    <span class="cs-label">👑<span id="q1alive">1</span></span>
  </div>

  <div class="divider"></div>

  <div class="colony-stat">
    <span class="cs-label">COL.2</span>
    <span class="cs-val c2" id="cnt2">0</span>
    <div class="cs-bar"><div class="cs-fill fill2" id="bar2" style="width:50%"></div></div>
    <span class="cs-label">👑<span id="q2alive">1</span></span>
  </div>

  <div class="divider"></div>

  <div class="colony-stat">
    <span class="cs-label">FOOD</span>
    <span class="cs-val" id="foodCnt" style="color:var(--food)">0</span>
    <span class="cs-label" style="margin-left:6px;">TIME</span>
    <span class="cs-val" id="timeCnt" style="color:#8a7a5a">0</span>
  </div>

  <div id="controls">
    <button class="btn" id="speedBtn" onclick="toggleSpeed()">⚡ x1</button>
    <button class="btn" id="warBtn" onclick="triggerWar()">⚔ WAR</button>
    <button class="btn" onclick="addFood()">🍖 FOOD DROP</button>
    <button class="btn" onclick="resetSim()">↺ RESET</button>
  </div>
</div>

<div id="canvasWrap">
  <canvas id="mainCanvas"></canvas>
  <canvas id="pheCanvas"></canvas>
  <canvas id="antCanvas"></canvas>

  <div id="sidebar">
    <div class="slog">// EVENT LOG</div>
    <div id="eventLog"></div>
  </div>

  <div id="legend">
    <div class="leg-row"><div class="leg-dot" style="background:var(--c1);width:12px;height:12px;border-radius:50%;"></div> Colony 1 (orange)</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--c2);width:12px;height:12px;border-radius:50%;"></div> Colony 2 (blue)</div>
    <div class="leg-row"><div class="leg-dot" style="background:#f5d020;width:14px;height:14px;border-radius:50%;border:2px solid #fff"></div> Queen</div>
    <div class="leg-row"><div class="leg-dot" style="background:#ff4444;border-radius:2px;"></div> Soldier</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--food);"></div> Food</div>
    <div class="leg-row" style="color:#7a6a4a;">Trails = pheromones</div>
  </div>

  <div id="tooltip"></div>
</div>

<script>
// ══════════════════ CONFIG ══════════════════
const CFG = {
  workerSpeed: 1.2,
  soldierSpeed: 1.6,
  queenSpeed: 0.3,
  workerSense: 60,
  soldierSense: 90,
  pheEvap: 0.994,       // pheromone evaporation per tick
  pheStrength: 220,
  foodValue: 3,
  spawnEvery: 180,      // ticks between spawn
  maxAnts: 120,         // per colony
  foodCount: 35,
  warRadius: 25,
  soldierRatio: 0.18,
};

// ══════════════════ CANVAS ══════════════════
const wrap = document.getElementById('canvasWrap');
const mainC = document.getElementById('mainCanvas');
const pheC  = document.getElementById('pheCanvas');
const antC  = document.getElementById('antCanvas');
const mCtx  = mainC.getContext('2d');
const pCtx  = pheC.getContext('2d');
const aCtx  = antC.getContext('2d');
let W=0,H=0;

function resize(){
  const r=wrap.getBoundingClientRect();
  W=Math.floor(r.width); H=Math.floor(r.height);
  [mainC,pheC,antC].forEach(c=>{c.width=W;c.height=H;});
  drawTerrain();
}
window.addEventListener('resize',()=>{resize();});

// ══════════════════ TERRAIN ══════════════════
let terrainData = null;
function drawTerrain(){
  // Soil texture
  mCtx.fillStyle='#1a1208'; mCtx.fillRect(0,0,W,H);
  // Noise-like soil patches
  for(let i=0;i<600;i++){
    const x=Math.random()*W, y=Math.random()*H;
    const r=Math.random()*18+4;
    mCtx.beginPath(); mCtx.arc(x,y,r,0,Math.PI*2);
    mCtx.fillStyle=`rgba(${45+Math.random()*20},${30+Math.random()*15},${10+Math.random()*8},${Math.random()*.4+.1})`;
    mCtx.fill();
  }
  // Pebbles
  for(let i=0;i<80;i++){
    const x=Math.random()*W, y=Math.random()*H;
    const r=Math.random()*5+1;
    mCtx.beginPath(); mCtx.arc(x,y,r,0,Math.PI*2);
    mCtx.fillStyle=`rgba(80,65,45,${Math.random()*.5+.2})`;
    mCtx.fill();
  }
}

// ══════════════════ PHEROMONE GRID ══════════════════
const CELL = 4; // pixels per pheromone cell
let PW,PH;
let pheHome1,pheHome2,pheFood1,pheFood2; // typed arrays

function initPhe(){
  PW=Math.ceil(W/CELL); PH=Math.ceil(H/CELL);
  const n=PW*PH;
  pheHome1=new Float32Array(n);
  pheHome2=new Float32Array(n);
  pheFood1=new Float32Array(n);
  pheFood2=new Float32Array(n);
}

function pIdx(x,y){return Math.floor(y/CELL)*PW+Math.floor(x/CELL);}

function evaporatePhe(){
  for(let i=0,n=PW*PH;i<n;i++){
    pheHome1[i]*=CFG.pheEvap; pheHome2[i]*=CFG.pheEvap;
    pheFood1[i]*=CFG.pheEvap; pheFood2[i]*=CFG.pheEvap;
  }
}

function drawPheromones(){
  pCtx.clearRect(0,0,W,H);
  const imgData = pCtx.createImageData(W,H);
  const d=imgData.data;
  for(let cy=0;cy<PH;cy++){
    for(let cx=0;cx<PW;cx++){
      const i=cy*PW+cx;
      const f1=pheFood1[i], h1=pheHome1[i];
      const f2=pheFood2[i], h2=pheHome2[i];
      // px range
      const px0=cx*CELL, py0=cy*CELL;
      const px1=Math.min(px0+CELL,W), py1=Math.min(py0+CELL,H);
      for(let py=py0;py<py1;py++){
        for(let px=px0;px<px1;px++){
          const pi=(py*W+px)*4;
          // Colony 1: orange trail (food=bright, home=dim)
          const o1=Math.min(255,f1*1.8+h1*.6);
          // Colony 2: blue trail
          const o2=Math.min(255,f2*1.8+h2*.6);
          d[pi]  =Math.min(255,o1*1.1);   // R (orange)
          d[pi+1]=Math.min(255,o1*.4+o2*.2); // G
          d[pi+2]=Math.min(255,o2*1.1);   // B (blue)
          d[pi+3]=Math.min(80,o1*.5+o2*.5);
        }
      }
    }
  }
  pCtx.putImageData(imgData,0,0);
}

// ══════════════════ FOOD ══════════════════
let foods=[];
function spawnFood(x,y){
  foods.push({x:x||Math.random()*W,y:y||Math.random()*H,amount:CFG.foodValue,r:5+Math.random()*4});
}
function initFood(){
  foods=[];
  for(let i=0;i<CFG.foodCount;i++) spawnFood();
}

// ══════════════════ ANTS ══════════════════
let colonies=[];
let antId=0;

class Ant {
  constructor(col, x, y, type='worker'){
    this.id=antId++;
    this.col=col;
    this.x=x; this.y=y;
    this.type=type; // worker, soldier, queen
    this.angle=Math.random()*Math.PI*2;
    this.speed=type==='queen'?CFG.queenSpeed:type==='soldier'?CFG.soldierSpeed:CFG.workerSpeed;
    this.hasFood=false;
    this.hp=type==='queen'?200:type==='soldier'?60:20;
    this.maxHp=this.hp;
    this.age=0;
    this.state='explore'; // explore, toFood, toHome, fight
    this.targetFood=null;
    this.targetEnemy=null;
    this.wanderTimer=0;
    this.size=type==='queen'?5:type==='soldier'?3.5:2.5;
  }

  sense(){
    const c=this.col;
    const pheF=c===0?pheFood1:pheFood2;
    const pheH=c===0?pheHome1:pheHome2;
    const sense=this.type==='soldier'?CFG.soldierSense:CFG.workerSense;

    if(this.type==='queen') return; // queen doesn't forage

    // If carrying food → follow home pheromone
    if(this.hasFood){
      this.state='toHome';
      let best=-1, bestA=this.angle;
      for(let a=-Math.PI/3;a<=Math.PI/3;a+=0.2){
        const na=this.angle+a;
        const sx=this.x+Math.cos(na)*sense*.5;
        const sy=this.y+Math.sin(na)*sense*.5;
        if(sx<0||sx>=W||sy<0||sy>=H) continue;
        const v=pheH[pIdx(sx,sy)];
        if(v>best){best=v;bestA=na;}
      }
      this.angle=bestA+((Math.random()-.5)*.3);
      return;
    }

    // Soldiers: hunt enemies first
    if(this.type==='soldier'){
      const enemies=colonies[1-c].ants;
      let nearest=null, nDist=Infinity;
      for(const e of enemies){
        const d=dist(this.x,this.y,e.x,e.y);
        if(d<nDist){nDist=d;nearest=e;}
      }
      if(nearest && nDist < CFG.warRadius*3){
        this.targetEnemy=nearest;
        this.state='fight';
        this.angle=Math.atan2(nearest.y-this.y, nearest.x-this.x);
        return;
      }
    }

    // Workers: find food pheromone or nearby food
    let bestF=-1, bestA=this.angle;
    for(let a=-Math.PI/2;a<=Math.PI/2;a+=0.15){
      const na=this.angle+a;
      const sx=this.x+Math.cos(na)*sense;
      const sy=this.y+Math.sin(na)*sense;
      if(sx<0||sx>=W||sy<0||sy>=H) continue;
      const v=pheF[pIdx(sx,sy)];
      if(v>bestF){bestF=v;bestA=na;}
    }
    if(bestF>5){
      this.angle=bestA+((Math.random()-.5)*.2);
      this.state='toFood';
    } else {
      this.state='explore';
    }
  }

  move(){
    if(this.type==='queen'){
      // Queen wanders slowly near nest
      this.wanderTimer--;
      if(this.wanderTimer<=0){
        this.angle+=((Math.random()-.5)*Math.PI*.5);
        this.wanderTimer=60+Math.random()*60;
      }
      const nx=this.x+Math.cos(this.angle)*this.speed;
      const ny=this.y+Math.sin(this.angle)*this.speed;
      const nest=colonies[this.col].nest;
      const d=dist(nx,ny,nest.x,nest.y);
      if(d>40){ this.angle=Math.atan2(nest.y-this.y,nest.x-this.x)+((Math.random()-.5)*.5); }
      else { this.x=nx; this.y=ny; }
      return;
    }

    if(this.state==='fight' && this.targetEnemy){
      this.angle=Math.atan2(this.targetEnemy.y-this.y,this.targetEnemy.x-this.x);
    } else {
      // wander noise
      this.wanderTimer--;
      if(this.wanderTimer<=0){
        this.angle+=((Math.random()-.5)*Math.PI*.6);
        this.wanderTimer=20+Math.random()*30;
      }
    }

    const nx=this.x+Math.cos(this.angle)*this.speed;
    const ny=this.y+Math.sin(this.angle)*this.speed;

    // Bounce off edges
    if(nx<2||nx>W-2){ this.angle=Math.PI-this.angle; }
    else this.x=nx;
    if(ny<2||ny>H-2){ this.angle=-this.angle; }
    else this.y=ny;
  }

  dropPheromone(){
    const i=pIdx(this.x,this.y);
    if(i<0||i>=PW*PH) return;
    if(this.col===0){
      if(this.hasFood) pheFood1[i]=Math.min(255,pheFood1[i]+CFG.pheStrength*.4);
      else pheHome1[i]=Math.min(255,pheHome1[i]+CFG.pheStrength*.15);
    } else {
      if(this.hasFood) pheFood2[i]=Math.min(255,pheFood2[i]+CFG.pheStrength*.4);
      else pheHome2[i]=Math.min(255,pheHome2[i]+CFG.pheStrength*.15);
    }
  }

  interact(){
    const col=colonies[this.col];
    const nest=col.nest;

    if(this.type==='queen') return;

    if(this.type==='worker'){
      // Pick up food
      if(!this.hasFood){
        for(let fi=foods.length-1;fi>=0;fi--){
          const f=foods[fi];
          if(dist(this.x,this.y,f.x,f.y)<f.r+3){
            this.hasFood=true;
            f.amount--;
            if(f.amount<=0) foods.splice(fi,1);
            // Boost food pheromone
            const i=pIdx(this.x,this.y);
            if(this.col===0) pheFood1[i]=Math.min(255,pheFood1[i]+CFG.pheStrength);
            else pheFood2[i]=Math.min(255,pheFood2[i]+CFG.pheStrength);
            break;
          }
        }
      }
      // Return food to nest
      if(this.hasFood && dist(this.x,this.y,nest.x,nest.y)<nest.r+5){
        this.hasFood=false;
        col.food++;
        col.totalFood++;
        this.angle+=Math.PI; // turn around
        // Spawn new worker when enough food
        if(col.food>=4 && col.ants.length < CFG.maxAnts && col.queens>0){
          col.food-=4;
          const isSoldier = Math.random()<CFG.soldierRatio;
          col.ants.push(new Ant(this.col, nest.x+(Math.random()-0.5)*10, nest.y+(Math.random()-0.5)*10, isSoldier?'soldier':'worker'));
          logEvent(isSoldier?`Col${this.col+1} spawned soldier!`:'birth', this.col, isSoldier?'war':'birth');
        }
      }
    }

    // Combat
    if(this.state==='fight' && this.targetEnemy){
      const d=dist(this.x,this.y,this.targetEnemy.x,this.targetEnemy.y);
      if(d<this.size+this.targetEnemy.size+2){
        const dmg=this.type==='soldier'?8:3;
        this.targetEnemy.hp-=dmg*(0.8+Math.random()*.4);
      }
      if(d>CFG.warRadius*4) this.targetEnemy=null;
    }
  }
}

// ══════════════════ COLONY ══════════════════
function createColony(id, nx, ny, color, colorSold, colorQ){
  const col={
    id, color, colorSold, colorQ,
    nest:{x:nx,y:ny,r:20},
    ants:[], queens:1, food:0, totalFood:0, kills:0,
  };
  // Queen
  col.ants.push(new Ant(id,nx,ny,'queen'));
  // Initial workers
  for(let i=0;i<15;i++) col.ants.push(new Ant(id,nx+(Math.random()-0.5)*30,ny+(Math.random()-0.5)*30,'worker'));
  // Initial soldiers
  for(let i=0;i<4;i++) col.ants.push(new Ant(id,nx+(Math.random()-0.5)*20,ny+(Math.random()-0.5)*20,'soldier'));
  return col;
}

// ══════════════════ EVENTS ══════════════════
const events=[];
function logEvent(msg, col, type='normal'){
  const el=document.getElementById('eventLog');
  const prefix=col===0?'[C1] ':'[C2] ';
  const cls=type==='war'?'war':type==='food'?'food':type==='birth'?'birth':'';
  events.unshift({msg:prefix+msg,cls});
  if(events.length>12) events.pop();
  el.innerHTML=events.map((e,i)=>`<div class="event ${e.cls} ${i>5?'old':''}">${e.msg}</div>`).join('');
}

// ══════════════════ STATE ══════════════════
let tick=0, speed=1, warMode=false, rafId=null;

function init(){
  resize();
  initPhe();
  initFood();
  const margin=80;
  colonies=[
    createColony(0, margin+Math.random()*80, H/2+(Math.random()-.5)*H*.4, '#e85d04','#cc2200','#f5d020'),
    createColony(1, W-margin-Math.random()*80, H/2+(Math.random()-.5)*H*.4, '#3a86ff','#1144cc','#f5d020'),
  ];
  tick=0;
  logEvent('Simulation started!',0,'birth');
  logEvent('Colonies initialized!',1,'birth');
}

function resetSim(){
  if(rafId) cancelAnimationFrame(rafId);
  init();
  loop();
}

function toggleSpeed(){
  speed=speed===1?10:speed===10?25:1;
  const btn=document.getElementById('speedBtn');
  btn.textContent=`⚡ x${speed}`;
  btn.className=speed>1?'btn active':'btn';
  if(speed>1) btn.style.background='var(--c1)',btn.style.color='#000';
  else btn.style.background='',btn.style.color='var(--c1)';
}

function triggerWar(){
  warMode=!warMode;
  const btn=document.getElementById('warBtn');
  btn.className=warMode?'btn warBtn active':'btn warBtn';
  btn.style.background=warMode?'#ff4444':'';
  btn.style.color=warMode?'#000':'#ff4444';
  if(warMode){
    logEvent('WAR DECLARED!',0,'war');
    logEvent('WAR DECLARED!',1,'war');
    // Boost soldiers
    colonies.forEach(col=>{
      for(let i=0;i<6;i++){
        if(col.ants.length<CFG.maxAnts)
          col.ants.push(new Ant(col.id,col.nest.x+(Math.random()-0.5)*20,col.nest.y+(Math.random()-0.5)*20,'soldier'));
      }
    });
  }
}

function addFood(){
  for(let i=0;i<8;i++) spawnFood(Math.random()*W*0.6+W*0.2, Math.random()*H);
  logEvent('Food dropped!',0,'food');
}

// ══════════════════ MAIN LOOP ══════════════════
function loop(){
  for(let s=0;s<speed;s++) stepSim();
  renderFrame();
  updateHUD();
  rafId=requestAnimationFrame(loop);
}

const dist=(ax,ay,bx,by)=>Math.sqrt((ax-bx)**2+(ay-by)**2);

function stepSim(){
  tick++;

  // Occasional food replenish
  if(tick%600===0 && foods.length<8) for(let i=0;i<6;i++) spawnFood();

  evaporatePhe();

  colonies.forEach(col=>{
    // Sense → move → drop pheromone → interact
    for(const ant of col.ants){
      ant.age++;
      // War mode: soldiers go aggressive
      if(warMode && ant.type==='soldier' && Math.random()<0.05){
        ant.state='fight';
        const enemies=colonies[1-col.id].ants;
        if(enemies.length>0) ant.targetEnemy=enemies[Math.floor(Math.random()*enemies.length)];
      }
      ant.sense();
      ant.move();
      ant.dropPheromone();
      ant.interact();
    }

    // Remove dead ants
    const before=col.ants.length;
    col.ants=col.ants.filter(a=>{
      if(a.hp<=0){
        if(a.type==='queen'){
          col.queens--;
          logEvent('QUEEN KILLED!',col.id,'war');
        }
        return false;
      }
      return true;
    });
    const killed=before-col.ants.length;
    if(killed>0) colonies[1-col.id].kills+=killed;

    // Count queens
    col.queens=col.ants.filter(a=>a.type==='queen').length;

    // Queen spawns eggs if colony has food and not at max
    if(tick%CFG.spawnEvery===0 && col.food>=2 && col.ants.length<CFG.maxAnts && col.queens>0){
      col.food-=2;
      const isSoldier=warMode?Math.random()<0.5:Math.random()<CFG.soldierRatio;
      col.ants.push(new Ant(col.id,col.nest.x+(Math.random()-.5)*15,col.nest.y+(Math.random()-.5)*15,isSoldier?'soldier':'worker'));
    }

    // Rare queen reproduction (very slow)
    if(tick%2000===0 && col.queens>0 && col.food>20 && Math.random()<0.3){
      col.food-=20;
      col.ants.push(new Ant(col.id,col.nest.x,col.nest.y,'queen'));
      col.queens++;
      logEvent('New queen born!',col.id,'birth');
    }
  });

  // Check win/lose
  if(tick%300===0){
    colonies.forEach(col=>{
      if(col.queens===0 && col.ants.length<5){
        logEvent('COLONY COLLAPSED!',col.id,'war');
      }
    });
  }
}

// ══════════════════ RENDER ══════════════════
function renderFrame(){
  // Pheromones
  if(tick%2===0) drawPheromones();

  // Ants
  aCtx.clearRect(0,0,W,H);

  // Food
  foods.forEach(f=>{
    aCtx.beginPath();aCtx.arc(f.x,f.y,f.r,0,Math.PI*2);
    aCtx.fillStyle=`rgba(76,175,80,${0.4+f.amount/CFG.foodValue*.6})`;
    aCtx.fill();
    aCtx.strokeStyle='rgba(130,220,80,.6)';aCtx.lineWidth=1;aCtx.stroke();
    // Glow
    aCtx.beginPath();aCtx.arc(f.x,f.y,f.r+3,0,Math.PI*2);
    aCtx.strokeStyle='rgba(76,175,80,.15)';aCtx.lineWidth=3;aCtx.stroke();
  });

  // Nests
  colonies.forEach(col=>{
    const n=col.nest;
    // Outer ring
    aCtx.beginPath();aCtx.arc(n.x,n.y,n.r+8,0,Math.PI*2);
    aCtx.strokeStyle=col.color+'44';aCtx.lineWidth=4;aCtx.stroke();
    // Nest body
    aCtx.beginPath();aCtx.arc(n.x,n.y,n.r,0,Math.PI*2);
    aCtx.fillStyle=col.color+'33';aCtx.fill();
    aCtx.strokeStyle=col.color+'88';aCtx.lineWidth=2;aCtx.stroke();
    // Nest label
    aCtx.font='bold 9px Share Tech Mono';
    aCtx.textAlign='center';aCtx.textBaseline='middle';
    aCtx.fillStyle=col.color;
    aCtx.fillText(`C${col.id+1}`,n.x,n.y);
  });

  // Ants
  colonies.forEach(col=>{
    col.ants.forEach(ant=>{
      const sz=ant.size;
      aCtx.save();
      aCtx.translate(ant.x,ant.y);
      aCtx.rotate(ant.angle);

      if(ant.type==='queen'){
        // Big diamond shape
        aCtx.beginPath();
        aCtx.moveTo(0,-sz*1.8);aCtx.lineTo(sz*1.2,0);
        aCtx.lineTo(0,sz*1.8);aCtx.lineTo(-sz*1.2,0);aCtx.closePath();
        aCtx.fillStyle='#f5d020';aCtx.fill();
        aCtx.strokeStyle='#ffffff88';aCtx.lineWidth=.8;aCtx.stroke();
        // Crown glow
        aCtx.beginPath();aCtx.arc(0,0,sz*2.2,0,Math.PI*2);
        aCtx.strokeStyle='rgba(245,208,32,.3)';aCtx.lineWidth=2;aCtx.stroke();
      } else if(ant.type==='soldier'){
        // Square-ish body
        aCtx.beginPath();
        aCtx.moveTo(sz*1.8,0);
        aCtx.lineTo(sz*.6,sz*.8);aCtx.lineTo(-sz*1.4,sz*.5);
        aCtx.lineTo(-sz*1.4,-sz*.5);aCtx.lineTo(sz*.6,-sz*.8);aCtx.closePath();
        aCtx.fillStyle=col.colorSold;aCtx.fill();
        // Head
        aCtx.beginPath();aCtx.arc(sz*1.6,0,sz*.7,0,Math.PI*2);
        aCtx.fillStyle=col.colorSold;aCtx.fill();
      } else {
        // Worker: classic ant shape
        // Abdomen
        aCtx.beginPath();aCtx.ellipse(-sz*.8,0,sz,sz*.65,0,0,Math.PI*2);
        aCtx.fillStyle=col.color;aCtx.fill();
        // Thorax
        aCtx.beginPath();aCtx.arc(sz*.3,0,sz*.55,0,Math.PI*2);
        aCtx.fillStyle=col.color;aCtx.fill();
        // Head
        aCtx.beginPath();aCtx.arc(sz*1.3,0,sz*.5,0,Math.PI*2);
        aCtx.fillStyle=col.color;aCtx.fill();
        // Antennae
        aCtx.strokeStyle=col.color+'cc';aCtx.lineWidth=.7;
        aCtx.beginPath();aCtx.moveTo(sz*1.5,-sz*.3);aCtx.lineTo(sz*2.5,-sz*1.2);aCtx.stroke();
        aCtx.beginPath();aCtx.moveTo(sz*1.5,sz*.3);aCtx.lineTo(sz*2.5,sz*1.2);aCtx.stroke();
        // Legs (3 pairs)
        aCtx.strokeStyle=col.color+'99';aCtx.lineWidth=.6;
        [-sz*.5,0,sz*.5].forEach(lx=>{
          aCtx.beginPath();aCtx.moveTo(lx,-sz*.65);aCtx.lineTo(lx-sz*.3,-sz*1.4);aCtx.stroke();
          aCtx.beginPath();aCtx.moveTo(lx,sz*.65);aCtx.lineTo(lx-sz*.3,sz*1.4);aCtx.stroke();
        });
      }

      // Carrying food dot
      if(ant.hasFood){
        aCtx.beginPath();aCtx.arc(sz*1.8,0,sz*.5,0,Math.PI*2);
        aCtx.fillStyle='#88ee44';aCtx.fill();
      }

      // HP bar for injured
      if(ant.hp<ant.maxHp*.9){
        const pct=ant.hp/ant.maxHp;
        const bw=sz*4;
        aCtx.fillStyle='#333';aCtx.fillRect(-bw/2,-sz*2.5,bw,1.5);
        aCtx.fillStyle=pct>.5?'#44ff44':'#ff4444';
        aCtx.fillRect(-bw/2,-sz*2.5,bw*pct,1.5);
      }

      aCtx.restore();
    });
  });
}

// ══════════════════ HUD ══════════════════
function updateHUD(){
  const c1=colonies[0],c2=colonies[1];
  const t1=c1.ants.length, t2=c2.ants.length, tMax=CFG.maxAnts;
  document.getElementById('cnt1').textContent=t1;
  document.getElementById('cnt2').textContent=t2;
  document.getElementById('bar1').style.width=Math.min(100,t1/tMax*100)+'%';
  document.getElementById('bar2').style.width=Math.min(100,t2/tMax*100)+'%';
  document.getElementById('q1alive').textContent=c1.queens;
  document.getElementById('q2alive').textContent=c2.queens;
  document.getElementById('foodCnt').textContent=foods.length;
  document.getElementById('timeCnt').textContent=Math.floor(tick/60)+'s';
}

// ══════════════════ TOOLTIP ══════════════════
antC.addEventListener('mousemove',e=>{
  const r=antC.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let found=null;
  for(const col of colonies){
    for(const ant of col.ants){
      if(dist(mx,my,ant.x,ant.y)<12){found={ant,col};break;}
    }
    if(found) break;
  }
  const tip=document.getElementById('tooltip');
  if(found){
    const {ant,col}=found;
    tip.style.display='block';
    tip.style.left=(mx+14)+'px'; tip.style.top=(my-10)+'px';
    tip.innerHTML=`<span style="color:${col.color}">${col.id===0?'Colony 1':'Colony 2'}</span> · ${ant.type.toUpperCase()}<br>HP: ${Math.ceil(ant.hp)}/${ant.maxHp} · Age: ${ant.age}t<br>State: ${ant.state}${ant.hasFood?' · 🍖 carrying':''}`;
  } else {
    tip.style.display='none';
  }
});

// ══════════════════ START ══════════════════
init();
loop();
</script>
